<script>
const NS='http://www.w3.org/2000/svg';
const C={shu:'#b8322a',ai:'#25477a',gold:'#b0812a',ink:'#2a221c',green:'#3d6b3a'};
const $=s=>document.querySelector(s);
const svg=$('#map'),gPins=$('#gPins'),gRoutes=$('#gRoutes'),gStatic=$('#gStatic'),gLand=$('#gLand'),gForeign=$('#gForeign'),fx=$('#fx');

/* ---------- 地図（簡略化した海岸線：経度,緯度） ---------- */
const xy=ll=>[(ll[0]-127.5)*48.6,(46.5-ll[1])*60];
const LAND={
 hokkaido:[[141.9,45.5],[142.5,45.0],[143.3,44.3],[144.3,44.0],[145.3,44.3],[145.2,43.6],[145.8,43.4],[145.0,43.1],[144.0,42.9],[143.3,42.0],[142.5,42.2],[141.6,42.6],[141.0,42.3],[140.9,41.8],[140.1,41.4],[140.0,41.8],[140.4,42.5],[139.9,42.6],[140.4,43.2],[141.3,43.2],[141.4,43.8],[141.7,44.4],[141.6,45.2]],
 honshu:[[140.9,41.5],[141.5,41.4],[141.5,40.5],[142.0,39.6],[141.6,38.9],[141.5,38.4],[141.0,38.2],[140.95,37.0],[140.6,36.5],[140.85,35.7],[140.4,35.15],[139.85,34.9],[139.85,35.3],[140.1,35.6],[139.8,35.65],[139.65,35.45],[139.7,35.2],[139.6,35.13],[139.55,35.3],[139.1,35.2],[139.15,34.9],[138.85,34.6],[138.75,34.95],[138.5,35.1],[138.25,34.65],[137.5,34.65],[136.9,34.75],[136.8,34.3],[136.0,33.5],[135.4,33.5],[135.1,34.3],[135.4,34.7],[134.7,34.75],[133.9,34.5],[133.0,34.35],[132.4,34.3],[131.9,33.9],[131.0,33.95],[130.9,34.3],[131.4,34.5],[132.0,35.0],[132.7,35.5],[133.3,35.55],[134.3,35.6],[135.3,35.6],[135.7,35.5],[136.1,35.8],[136.0,36.3],[136.7,36.9],[136.8,37.4],[137.3,37.5],[137.0,36.8],[137.5,36.95],[138.2,37.1],[138.8,37.8],[139.4,38.3],[139.8,39.0],[140.0,39.7],[139.8,40.1],[140.0,40.6],[140.3,41.2],[140.7,40.9]],
 shikoku:[[132.0,33.35],[132.5,33.0],[132.9,32.75],[133.3,33.4],[133.9,33.5],[134.2,33.2],[134.7,33.8],[134.6,34.2],[134.0,34.35],[133.5,34.05],[133.1,34.0],[132.7,33.9],[132.4,33.6]],

};
const FOREIGN={
 asia:[[126.3,34.4],[127.5,34.6],[128.6,35.1],[129.4,35.4],[129.5,36.5],[129.4,37.5],[128.4,38.6],[127.5,39.7],[128.6,40.4],[129.8,41.0],[130.6,42.4],[131.9,43.1],[133.1,42.7],[135.1,43.5],[137.0,45.0],[138.4,46.6],[140.3,48.6],[141.0,53],[105,53],[105,20],[110,21],[114,22.3],[117,23.5],[119.5,26],[120.5,28],[121.9,30.8],[121,32],[120.3,34.3],[119.2,35],[120.3,36],[122.5,37.3],[121,37.8],[118.8,37.8],[118,38.5],[121,39],[122.3,40.4],[124.3,39.9],[125.1,39.6],[125.4,38.0],[126.6,37.6],[126.4,36.8],[126.5,36.0],[126.4,35.0]],
 sakhalin:[[141.8,46.1],[142.3,46.6],[143.5,46.8],[142.6,47.5],[143.0,49.2],[144.6,48.9],[143.6,50.5],[143.2,52.5],[142.0,52.5],[142.1,49.5],[141.9,47.9]]
};
const P={edo:[139.76,35.68],uraga:[139.72,35.24],anchor:[139.84,34.97],bay:[139.8,35.42],kanagawa:[139.64,35.44],shimoda:[138.94,34.68],hakodate:[140.73,41.77],nagasaki:[129.87,32.75],shanghai:[122.3,31.2]};
const pl=k=>typeof k==='string'?P[k]:k;
const at=k=>xy(pl(k));
function mk(tag,a,parent){const e=document.createElementNS(NS,tag);for(const k in a)e.setAttribute(k,a[k]);parent&&parent.appendChild(e);return e}
const dPath=arr=>arr.map((p,i)=>{const[x,y]=xy(p);return(i?'L':'M')+x.toFixed(1)+','+y.toFixed(1)}).join('')+'Z';
for(const k in FOREIGN)mk('path',{d:dPath(FOREIGN[k]),fill:'#cfc6b2',stroke:'#8a7b66','stroke-width':1,'vector-effect':'non-scaling-stroke'},gForeign);
const landEls=[];
for(const k in LAND){
  mk('path',{d:dPath(LAND[k]),fill:'#9c8a6c',opacity:.35,transform:'translate(3,4)'},gLand);
  landEls.push(mk('path',{d:dPath(LAND[k]),fill:'#eadfc4',stroke:'#5a4a3a','stroke-width':1.6,'stroke-linejoin':'round','vector-effect':'non-scaling-stroke'},gLand));
}

/* ---------- アニメーションの仕組み ---------- */
let scene=0;const tweens=[];
function tween(d,fn,delay=0,done){tweens.push({s:performance.now()+delay,d:Math.max(1,d),fn,done,sc:scene})}
const after=(ms,fn)=>tween(1,()=>{},ms,fn);
const ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
const back=t=>{const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2)};
let pins=[],statics=[],vs=1;
const camLL=(lon,lat,w,h)=>{const[x,y]=xy([lon,lat]);return{x,y,w,h:h||w}};
const FULL={x:490,y:560,w:860,h:1060};
const KANTO=camLL(139.75,35.2,330,330);
const PACIFIC=camLL(136,36,1500,1150);
let cam={...KANTO};setTimeout(()=>{cam={...S[0].cam}},0);
function camTo(t,d=1800){const f={...cam};tween(d,p=>{const e=ease(p);cam={x:f.x+(t.x-f.x)*e,y:f.y+(t.y-f.y)*e,w:f.w+(t.w-f.w)*e,h:f.h+(t.h-f.h)*e}})}
function applyView(){
  const r=svg.getBoundingClientRect();if(!r.width)return;
  const a=r.height/r.width;let w=cam.w,h=cam.h;if(h/w>a)w=h/a;else h=w*a;
  svg.setAttribute('viewBox',`${cam.x-w/2} ${cam.y-h/2} ${w} ${h}`);
  vs=w/r.width;
  for(const p of pins.concat(statics))p.g.setAttribute('transform',`translate(${p.x.toFixed(2)},${p.y.toFixed(2)}) scale(${(vs*p.sc).toFixed(4)}) translate(${p.ox},${p.oy}) rotate(${p.rot})`);
}
function loop(now){
  for(let i=tweens.length-1;i>=0;i--){const t=tweens[i];
    if(t.sc!==scene){tweens.splice(i,1);continue}
    if(now<t.s)continue;const p=Math.min(1,(now-t.s)/t.d);t.fn(p);
    if(p>=1){tweens.splice(i,1);t.done&&t.done()}}
  applyView();checkKeys();requestAnimationFrame(loop);
}
function addPin(pt,sc=1,stat){const g=mk('g',{},stat?gStatic:gPins);const p={g,x:pt[0],y:pt[1],sc,rot:0,ox:0,oy:0};(stat?statics:pins).push(p);return p}
function removePin(p){p.g.remove();const i=pins.indexOf(p);if(i>=0)pins.splice(i,1)}
function txt(g,s,x,y,o={}){const t=mk('text',{x,y,'font-size':o.size||15,fill:o.color||C.ink,'text-anchor':o.anchor||'start','font-weight':o.weight||700,stroke:o.halo||'#fbf5e6','stroke-width':4,'paint-order':'stroke','stroke-linejoin':'round'},g);t.textContent=s;return t}
function pop(p,to=1,delay=0){p.sc=0;tween(500,t=>p.sc=to*back(t),delay)}
function marker(k,label,o={}){const c=o.color||C.shu;const p=addPin(at(k),0);
  if(o.ring!==false)mk('circle',{r:7,fill:'none',stroke:c,'stroke-width':2.5,class:'ring'},p.g);
  p.dot=mk('circle',{r:6.5,fill:c,stroke:'#fffaf0','stroke-width':2},p.g);
  if(label)p.t=txt(p.g,label,o.dx??12,(o.dy??0)+5,{anchor:o.anchor||'start',size:o.size||16});
  pop(p,1,o.delay||0);return p}
function label(k,s,o={}){const p=addPin(at(k),0);txt(p.g,s,0,0,{anchor:'middle',size:o.size||16,color:o.color||C.ink});pop(p,1,o.delay||0);return p}
function bubble(k,text,o={}){const p=addPin(at(k),0);const tg=mk('g',{},p.g);
  text.split('\n').forEach((ln,i)=>{mk('text',{x:0,y:i*21,'font-size':o.size||16,'text-anchor':'middle',fill:C.ink,'font-weight':700},tg).textContent=ln});
  const b=tg.getBBox(),pad=9,h=b.height+pad*2,dx=o.dx||0,oy=(o.dy??-20)-h;
  tg.setAttribute('transform',`translate(${dx},${oy+pad-b.y})`);
  p.g.insertBefore(mk('path',{d:`M${dx-7},${oy+h-1} L0,-6 L${dx+7},${oy+h-1}Z`,fill:'#fffaf0',stroke:C.ink,'stroke-width':1.5}),tg);
  p.g.insertBefore(mk('rect',{x:dx-b.width/2-pad,y:oy,width:b.width+pad*2,height:h,rx:9,fill:'#fffaf0',stroke:C.ink,'stroke-width':1.5}),tg);
  p.g.insertBefore(mk('path',{d:`M${dx-6},${oy+h-2.5} L${dx+6},${oy+h-2.5}`,stroke:'#fffaf0','stroke-width':3}),tg);
  pop(p,1,o.delay||0);return p}
function smooth(pts,seg=14){if(pts.length<2)return pts.slice();const out=[];
  for(let i=0;i<pts.length-1;i++){const p0=pts[i-1]||pts[i],p1=pts[i],p2=pts[i+1],p3=pts[i+2]||p2;
    for(let s=0;s<seg;s++){const u=s/seg,u2=u*u,u3=u2*u;out.push([0,1].map(j=>.5*(2*p1[j]+(-p0[j]+p2[j])*u+(2*p0[j]-5*p1[j]+4*p2[j]-p3[j])*u2+(-p0[j]+3*p1[j]-3*p2[j]+p3[j])*u3)))}}
  out.push(pts[pts.length-1]);return out}
function route(keys,o={}){
  const raw=keys.map(k=>at(k));const pts=o.linear?raw:smooth(raw);const col=o.color||C.shu;
  const path=mk('path',{fill:'none',stroke:col,'stroke-width':o.w||4,'stroke-linecap':'round','stroke-linejoin':'round','vector-effect':'non-scaling-stroke',opacity:o.op||.92},gRoutes);
  if(o.dash)path.setAttribute('stroke-dasharray',o.dash);
  let head=null;if(o.arrow){head=addPin(pts[0],0);mk('path',{d:'M9,0 L-8,-7 L-4,0 L-8,7Z',fill:col},head.g)}
  tween(o.dur||1500,t=>{const f=t*(pts.length-1),n=Math.floor(f),r=f-n;const sub=pts.slice(0,n+1);
    if(n<pts.length-1){const a=pts[n],b=pts[n+1];sub.push([a[0]+(b[0]-a[0])*r,a[1]+(b[1]-a[1])*r])}
    path.setAttribute('d','M'+sub.map(q=>q[0].toFixed(1)+','+q[1].toFixed(1)).join('L'));
    const a=sub[sub.length-1],b=sub[Math.max(0,sub.length-2)];
    if(head){head.sc=1;head.x=a[0];head.y=a[1];if(a!==b)head.rot=Math.atan2(a[1]-b[1],a[0]-b[0])*180/Math.PI}},o.delay||0,o.done);
  return path}
function puff(p){const q=addPin([p.x,p.y],1);q.ox=p.ox;q.oy=p.oy-16;const c=mk('circle',{r:4,fill:'#444',opacity:.5},q.g);const y0=q.oy;
  tween(1500,t=>{q.sc=1+t*1.6;q.oy=y0-t*10;c.setAttribute('opacity',(.5*(1-t)).toFixed(2))},0,()=>removePin(q))}

function ship(from,to,o={}){const pts=smooth([from,...(o.via||[]),to].map(k=>at(k)),24);const p=addPin(pts[0],0);const g=p.g;
  if(o.off){p.ox=o.off[0];p.oy=o.off[1]}
  if(o.black){
    mk('path',{d:'M-18,-1 L18,-1 L13,7 L-14,7Z',fill:'#141414'},g);
    mk('rect',{x:-3,y:-14,width:6,height:13,fill:'#2b2b2b'},g);
    mk('line',{x1:-11,y1:-1,x2:-11,y2:-20,stroke:'#141414','stroke-width':1.6},g);
    mk('line',{x1:11,y1:-1,x2:11,y2:-18,stroke:'#141414','stroke-width':1.6},g);
    mk('circle',{cx:0,cy:3,r:4,fill:'none',stroke:'#c9a35a','stroke-width':1.2},g);
    if(o.flag!==false){mk('rect',{x:11,y:-25,width:9,height:6,fill:'#fff',stroke:'#1f3c88','stroke-width':1},g);mk('rect',{x:11,y:-25,width:4,height:3,fill:'#1f3c88'},g)}
  }else{
    mk('path',{d:'M-15,0 L15,0 L11,6 L-11,6Z',fill:o.hull||'#6b4a2b'},g);
    mk('line',{x1:0,y1:0,x2:0,y2:-22,stroke:'#3a2a1a','stroke-width':1.5},g);
    mk('path',{d:'M1,-21 Q12,-12 1,-3Z',fill:'#fbf6ea',stroke:'#7a6a55','stroke-width':1},g);
    mk('path',{d:'M-1,-19 Q-10,-11 -1,-4Z',fill:'#fbf6ea',stroke:'#7a6a55','stroke-width':1},g);
    if(o.flag)mk('rect',{x:-1,y:-29,width:10,height:6,fill:o.flag,stroke:'#333','stroke-width':.5},g);
  }
  if(o.label)txt(g,o.label,0,24,{anchor:'middle',size:13});
  tween(400,t=>p.sc=t,o.delay||0);
  let last=0;
  tween(o.dur||4000,t=>{const f=ease(t)*(pts.length-1),i=Math.floor(f),r=f-i,a=pts[i],b=pts[Math.min(i+1,pts.length-1)];p.x=a[0]+(b[0]-a[0])*r;p.y=a[1]+(b[1]-a[1])*r;
    const now=performance.now();if(o.black&&t<1&&now-last>260){last=now;puff(p)}},o.delay||0,o.done);
  return p}
function stamp(s,o={}){fx.querySelectorAll('.stamp').forEach(e=>e.remove());const d=document.createElement('div');d.className='stamp'+(o.keep?' keep':'');d.textContent=s;if(o.top)d.style.top=o.top;fx.appendChild(d)}

function boom(k,o={}){const n=o.n||3;for(let j=0;j<n;j++)after((o.delay||0)+j*(o.gap||380),()=>{const p=addPin(at(k),.2);p.ox=(Math.random()-.5)*(o.spread||16);p.oy=(Math.random()-.5)*(o.spread||16);
  mk('circle',{r:10,fill:'#ff9a2e',opacity:.9},p.g);mk('circle',{r:5,fill:'#fff3c4'},p.g);
  tween(700,t=>{p.sc=.3+t*2;p.g.setAttribute('opacity',(1-t).toFixed(2))},0,()=>removePin(p))})}
function bars(title,items,foot){const d=card('<h4>'+title+'</h4><div class="bars">'+items.map(it=>'<div style="background:'+(it[2]||'#b8322a')+'"><span>'+it[0]+'</span></div>').join('')+'</div>'+(foot?'<p>'+foot+'</p>':''));
  setTimeout(()=>d.querySelectorAll('.bars div').forEach((b,i)=>b.style.height=items[i][1]+'%'),120);return d}
function inPoly(lon,lat,poly){let c=false;for(let i=0,j=poly.length-1;i<poly.length;j=i++){const[xi,yi]=poly[i],[xj,yj]=poly[j];if(((yi>lat)!==(yj>lat))&&(lon<(xj-xi)*(lat-yi)/(yj-yi)+xi))c=!c}return c}
function landDots(n,color,o={}){const polys=[LAND.honshu,LAND.shikoku,LAND.kyushu];let made=0,tries=0;
  while(made<n&&tries<5000){tries++;const lon=130+Math.random()*12,lat=31+Math.random()*10.5;if(!polys.some(p=>inPoly(lon,lat,p)))continue;
    const p=addPin(xy([lon,lat]),0);mk('circle',{r:o.r||4.5,fill:color,stroke:'#fffaf0','stroke-width':1.2},p.g);pop(p,1,(o.delay||0)+made*(o.gap||40));made++}}
function ring(k,label,o={}){const p=addPin(at(k),0);mk('circle',{r:o.r||46,fill:o.fill||'rgba(184,50,42,.18)',stroke:o.color||C.shu,'stroke-width':2.5,'stroke-dasharray':'6 5'},p.g);
  if(label)txt(p.g,label,0,(o.r||46)+18,{anchor:'middle',size:15,color:o.color||C.shu});pop(p,1,o.delay||0);return p}
function person(k,label,o={}){const p=addPin(at(k),0);const g=p.g;
  mk('circle',{cx:0,cy:-24,r:6,fill:'#f2d3b0',stroke:C.ink,'stroke-width':1.5},g);
  mk('path',{d:'M-7,-17 L7,-17 L9,0 L-9,0Z',fill:o.color||C.ai,stroke:C.ink,'stroke-width':1.2},g);
  if(label)txt(g,label,0,16,{anchor:'middle',size:13});pop(p,1,o.delay||0);return p}
function walkAlong(keys,label,o={}){const pts=smooth(keys.map(k=>at(k)),12);const p=person(keys[0],label,o);
  tween(o.dur||5000,t=>{const f=t*(pts.length-1),i=Math.floor(f),r=f-i,a=pts[i],b=pts[Math.min(i+1,pts.length-1)];p.x=a[0]+(b[0]-a[0])*r;p.y=a[1]+(b[1]-a[1])*r},o.delay||0);return p}

const hasTTS='speechSynthesis' in window;let jaVoice=null;
function loadVoices(){if(!hasTTS)return;const v=speechSynthesis.getVoices();jaVoice=v.find(x=>/ja/i.test(x.lang)&&/Nanami|Google|Kyoko|Haruka|Ayumi/i.test(x.name))||v.find(x=>/ja/i.test(x.lang))||null}
if(hasTTS){loadVoices();speechSynthesis.onvoiceschanged=loadVoices}
let cur=-1,playing=false,voiceOn=true,token=0,timer=null,keep=[];
const est=s=>1800+yomi(s).length*150;
const TOTAL=S.reduce((a,s)=>a+est(s.say),0);
const audioEl=new Audio();
function updateProg(){const done=S.slice(0,Math.max(0,cur)).reduce((a,s)=>a+est(s.say),0);$('#prog i').style.width=(cur<0?0:Math.min(100,(done/TOTAL)*100))+'%';$('#time').textContent=(cur+1)+' / '+S.length}
function clearScene(){scene++;gPins.innerHTML='';gRoutes.innerHTML='';pins=[];fx.innerHTML=''}
function go(i){
  token++;clearTimeout(timer);hasTTS&&speechSynthesis.cancel();audioEl.pause();
  if(i>=S.length){setPlaying(false);$('#prog i').style.width='100%';showEnd();return}
  cur=i;const s=S[i];
  clearScene();camTo(s.cam);s.run();
  $('#chap').textContent=CHAP[s.c][0];$('#chap').style.background=CHAP[s.c][1];
  $('#sub').innerHTML=s.say;updateProg();startKeys(i);
  const my=token;
  const next=()=>{if(my!==token||!playing)return;const adv=()=>{if(my!==token||!playing)return;if(kBusy||kQueue.length){timer=setTimeout(adv,200);return}go(cur+1)};timer=setTimeout(adv,i===S.length-1?2500:900)};
  if(!playing)return;
  speak(s.say,next,my);
}
function speak(text,next,my){
  let fired=false;const fin=()=>{if(fired||my!==token)return;fired=true;next()};
  if(voiceOn&&AUDIO[cur]){
    audioEl.pause();audioEl.src=AUDIO[cur];audioEl.currentTime=0;
    audioEl.onended=fin;audioEl.onerror=fin;
    audioEl.play().catch(()=>{timer=setTimeout(fin,est(text))});
    setTimeout(fin,60000);return;
  }
  if(voiceOn&&hasTTS){const u=new SpeechSynthesisUtterance(yomi(text));u.lang='ja-JP';if(jaVoice)u.voice=jaVoice;u.rate=1.05;keep.push(u);
    u.onend=fin;u.onerror=fin;
    setTimeout(()=>{if(my===token)speechSynthesis.speak(u)},80);
    setTimeout(fin,est(text)*2+4000);
  }else{timer=setTimeout(fin,est(text))}
}
function setPlaying(v){playing=v;$('#play').textContent=v?'❚❚ 停止':'▶ 再生';
  if(!v){token++;clearTimeout(timer);hasTTS&&speechSynthesis.cancel();audioEl.pause();hideKanji();kq=null}else if(cur>=0&&cur<S.length){go(cur)}}
function showEnd(){const b=$('#qbox');$('#quiz').style.display='flex';b.innerHTML='<h1>おしまい</h1><p class="sm">内容をおぼえたか、クイズでたしかめよう！</p><button class="go" id="eq">✎ クイズに挑戦（4問）</button><button class="go sub2" id="er">⟲ もう一度見る</button><button class="go sub2" id="ec">まとめ画面を見る</button>';
  $('#eq').onclick=openQuiz;$('#er').onclick=()=>{$('#quiz').style.display='none';restart()};$('#ec').onclick=()=>$('#quiz').style.display='none'}
function restart(){cam={...S[0].cam};setPlaying(true);cur=-1;go(0)}

/* ---------- クイズ ---------- */
const QZ=[
 {q:'1860年、江戸城の桜田門の外で暗殺された大老は？',a:['井伊直弼','徳川慶喜','松平定信','水野忠邦'],ex:'大老の井伊直弼です。この事件を桜田門外の変といいます。'},
 {q:'井伊直弼が、天皇の許しを得ないまま結んだ条約は？',a:['日米修好通商条約','日米和親条約','下関条約','ポーツマス条約'],ex:'1858年の日米修好通商条約です。これが大きな反発をよびました。'},
 {q:'安政の大獄で処刑された、長州藩の思想家は？',a:['吉田松陰','坂本龍馬','高野長英','大塩平八郎'],ex:'吉田松陰です。松下村塾で、高杉晋作や伊藤博文などを育てました。'},
 {q:'井伊直弼をおそったのは、おもにどこの藩の浪士たち？',a:['水戸藩','薩摩藩','土佐藩','会津藩'],ex:'水戸藩の浪士たちが中心でした（薩摩藩の浪士も1人加わりました）。'}
];
let qi=0,score=0;
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function openQuiz(){setPlaying(false);qi=0;score=0;$('#quiz').style.display='flex';showQ()}
function showQ(){const q=QZ[qi],b=$('#qbox');const opts=shuffle(q.a.map((t,i)=>({t,ok:i===0})));
  b.innerHTML=`<div class="sm">第${qi+1}問 / ${QZ.length}問</div><div class="qq">${q.q}</div><div class="qa">${opts.map(o=>`<button data-ok="${o.ok?1:0}">${o.t}</button>`).join('')}</div><div class="qex"></div>`;
  b.querySelectorAll('.qa button').forEach(btn=>btn.onclick=()=>{const ok=btn.dataset.ok==='1';if(ok)score++;
    b.querySelectorAll('.qa button').forEach(x=>{x.disabled=true;if(x.dataset.ok==='1')x.classList.add('ok')});if(!ok)btn.classList.add('ng');
    const last=qi===QZ.length-1;b.querySelector('.qex').innerHTML=(ok?'<b class="good">⭕ 正解！</b> ':'<b class="bad">✖ ざんねん…</b> ')+q.ex+`<button class="go" id="qn">${last?'結果を見る':'次の問題へ'}</button>`;
    $('#qn').onclick=()=>{if(last)result();else{qi++;showQ()}}})}
function result(){const b=$('#qbox');const msg=score===QZ.length?'パーフェクト！テストもばっちり！':score>=QZ.length-1?'あと少し！まとめ画面で確認しよう':'もう一度動画を見てみよう！';
  b.innerHTML=`<h1>${score} / ${QZ.length} 問 正解</h1><p class="sm">${msg}</p><button class="go" id="r1">もう一度クイズ</button><button class="go sub2" id="r2">動画をもう一度見る</button><button class="go sub2" id="r3">閉じる</button>`;
  $('#r1').onclick=openQuiz;$('#r2').onclick=()=>{$('#quiz').style.display='none';restart()};$('#r3').onclick=()=>$('#quiz').style.display='none'}

/* ---------- ボタン ---------- */
$('#play').onclick=()=>{if(cur>=S.length-1&&!playing&&$('#prog i').style.width==='100%'){restart();return}setPlaying(!playing)};
$('#restart').onclick=restart;
$('#voice').onclick=()=>{voiceOn=!voiceOn;$('#voice').textContent=voiceOn?'🔊 語り':'🔇 字幕のみ';if(playing)go(cur)};
$('#quizBtn').onclick=openQuiz;
$('#prog').onclick=e=>{const r=e.currentTarget.getBoundingClientRect();const t=(e.clientX-r.left)/r.width*TOTAL;let acc=0,i=0;for(;i<S.length;i++){acc+=est(S[i].say);if(acc>t)break}$('#fog').classList.add('off');go(Math.min(i,S.length-1))};
document.addEventListener('keydown',e=>{if($('#intro').style.display!=='none')return;if(e.code==='Space'){e.preventDefault();$('#play').click()}else if(e.code==='ArrowRight')go(cur+1);else if(e.code==='ArrowLeft')go(Math.max(0,cur-1))});
function unlockK(){const f=KCLIP.flat()[0];if(!f)return;kAudio.src=f.a;kAudio.muted=true;kAudio.play().then(()=>{kAudio.pause();kAudio.currentTime=0;kAudio.muted=false}).catch(()=>{kAudio.muted=false})}
function start(v){unlockK();voiceOn=v&&(AUDIO.length>0||hasTTS);$('#voice').textContent=voiceOn?'🔊 語り':'🔇 字幕のみ';$('#intro').style.display='none';playing=true;$('#play').textContent='❚❚ 停止';go(0)}
$('#startV').onclick=()=>start(true);$('#startN').onclick=()=>start(false);
if(!hasTTS&&!AUDIO.length){$('#startV').style.display='none';$('#voice').style.display='none'}
requestAnimationFrame(loop);
</script>
